version: "3"

vars:
  OUT: "{{.ROOT_DIR}}/infra/cloudflare/alobo_runtime.auto.tfvars.json"

tasks:
  fetch-runtime:
    desc: Extract the current Alobo frontend version, response key, and salt
    cmds:
      - node src/fetch-runtime.ts --out "{{.OUT}}"

  ensure-runtime:
    internal: true
    status:
      - test -f "{{.OUT}}"
    cmds:
      - task: fetch-runtime

  cli:
    desc: "Read-only Alobo CLI, e.g. task alobo:cli -- venues --query 'an khanh'"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - node packages/alobo/src/cli.ts {{.CLI_ARGS}}

  test:
    desc: Unit tests
    cmds:
      - pnpm test
